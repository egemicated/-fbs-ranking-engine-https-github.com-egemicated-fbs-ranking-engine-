name: Basketball AP and Coaches polls
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Monday check, Tuesday recovery, or a one-off manual check
        type: choice
        options: [primary, recovery, manual]
        default: primary

permissions:
  contents: write
  actions: write

concurrency:
  group: production-basketball-refresh
  cancel-in-progress: false

jobs:
  archive:
    if: github.ref == 'refs/heads/main' && vars.BASKETBALL_REFRESH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check both polls behind the shared reserve
        id: polls
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          CBBD_API_KEY: ${{ secrets.CBBD_API_KEY }}
          BASKETBALL_SHARED_ACCOUNT_VERIFIED: ${{ vars.BASKETBALL_SHARED_ACCOUNT_VERIFIED }}
          BASKETBALL_POLL_MODE: ${{ inputs.mode }}
        run: node scripts/archive-basketball-polls.mjs
      - name: Validate the production build
        if: steps.polls.outputs.changed == 'true'
        run: node scripts/prepare-static.js
      - name: Publish verified editions through the protected release
        if: steps.polls.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          artifact=published/basketball-polls.json
          git add -- "$artifact"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Archive verified basketball AP and Coaches polls'
          for attempt in 1 2 3; do
            git fetch --no-tags origin main
            if ! git rebase origin/main; then git rebase --abort; exit 1; fi
            if git push origin HEAD:main; then
              revision=$(git rev-parse HEAD)
              run_id=$(gh api --method POST -H 'X-GitHub-Api-Version: 2026-03-10' \
                "repos/$GITHUB_REPOSITORY/actions/workflows/test.yml/dispatches" -f ref=main --jq .workflow_run_id)
              [[ "$run_id" =~ ^[0-9]+$ ]]
              checked_revision=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq .head_sha)
              [[ "$checked_revision" =~ ^[0-9a-f]{40}$ ]]
              if [[ "$checked_revision" != "$revision" ]]; then
                git fetch --no-tags origin main
                git merge-base --is-ancestor "$revision" "$checked_revision"
                [[ "$(git rev-parse "$checked_revision:$artifact")" == "$(git rev-parse "$revision:$artifact")" ]]
              fi
              printf '\nSubmitted %s for required Engine checks (run %s).\n' "$checked_revision" "$run_id" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          done
          exit 1
