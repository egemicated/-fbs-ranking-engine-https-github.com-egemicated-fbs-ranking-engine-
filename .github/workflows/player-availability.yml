name: Official player availability
run-name: ${{ github.event_name == 'schedule' && format('Scheduled update ({0})', github.event.schedule) || inputs.mode == 'overnight' && 'Forge overnight fallback' || github.workflow }}
on:
  schedule:
    - cron: '45 2 * 8-12,1 *'
      timezone: 'America/New_York'
    - cron: '45 4 * 8-12,1 *'
      timezone: 'America/New_York'
  workflow_dispatch:
    inputs:
      mode:
        description: Official report window to check
        type: choice
        options: [bootstrap, nightly, game-day, overnight]
        default: bootstrap
permissions:
  contents: write
  actions: write
concurrency:
  group: official-player-availability
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check whether the scheduled availability update is needed
        id: schedule
        if: github.event_name == 'schedule' || inputs.mode == 'overnight'
        env:
          GH_TOKEN: ${{ github.token }}
          SCHEDULED_FALLBACK: ${{ inputs.mode == 'overnight' }}
        run: node scripts/scheduled-update-needed.mjs availability
      - name: Check official conference reports
        id: reports
        if: (github.event_name != 'schedule' && inputs.mode != 'overnight') || steps.schedule.outputs.needed == 'true'
        env:
          MANUAL_MODE: ${{ inputs.mode }}
        run: |
          node scripts/publish-player-availability.js --mode "${MANUAL_MODE:-overnight}"
      - name: Commit changed availability reports
        if: (github.event_name != 'schedule' && inputs.mode != 'overnight') || steps.schedule.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ ! -d published/team-availability ]]; then exit 0; fi
          git add -- published/team-availability
          if git diff --cached --quiet; then
            echo "No changed availability reports to publish."
            exit 0
          fi
          node scripts/prepare-static.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Publish official player availability'
          git pull --rebase origin main
          git push origin HEAD:main
          gh workflow run test.yml --ref main
      - name: Report incomplete conference coverage
        if: steps.reports.outputs.incomplete == 'true'
        run: |
          echo '::error::Some due conference feeds failed. Successfully retrieved reports were saved.'
          exit 1
