name: Weekly player stats
run-name: ${{ inputs.daily && 'Forge daily player stats' || github.workflow }}
on:
  workflow_dispatch:
    inputs:
      daily:
        description: Incrementally update uncovered games after the daily football refresh
        type: boolean
        default: false
      football_run_id:
        description: Successful football source run ID (required in daily mode)
        type: string
      bootstrap:
        description: Build the current-season encrypted cache (up to 16 requests)
        type: boolean
        default: false
permissions:
  contents: write
  actions: write
concurrency:
  group: weekly-player-stats
  cancel-in-progress: false
jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify the daily football source publication
        if: inputs.daily
        env:
          UPSTREAM_RUN: ${{ inputs.football_run_id }}
          BOOTSTRAP: ${{ inputs.bootstrap }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ ! "$UPSTREAM_RUN" =~ ^[1-9][0-9]*$ || "$BOOTSTRAP" == true ]]; then
            echo '::error::Daily stats require a football run ID and standard incremental mode.'
            exit 1
          fi
          metadata=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$UPSTREAM_RUN" \
            --jq 'select(.head_branch == "main" and .path == ".github/workflows/weekly.yml" and .conclusion == "success") | [.run_attempt, .created_at] | @tsv')
          read -r attempt created_at <<< "$metadata"
          if [[ ! "$attempt" =~ ^[1-9][0-9]*$ || -z "$created_at" || \
              "$(TZ=Etc/GMT+7 date -d "$created_at" +%F)" != "$(TZ=Etc/GMT+7 date +%F)" ]]; then
            echo '::error::Daily stats require a successful football run from this morning.'
            exit 1
          fi
          published=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$UPSTREAM_RUN/attempts/$attempt/jobs" \
            --jq '[.jobs[].steps[] | select(.conclusion == "success") | .name] | index("Fetch CFBD and calculate rankings") != null and index("Save the weekly snapshot") != null')
          if [[ "$published" != true ]]; then
            echo '::error::The football run did not refresh the saved provider snapshot.'
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/cache/restore@v4
        with:
          path: research/cache/player-inputs/season-cache.encrypted.json
          key: player-source-v1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: player-source-v1-${{ runner.os }}-
      - name: Update player pages from the saved schedule
        id: refresh
        env:
          DAILY: ${{ inputs.daily }}
          BOOTSTRAP: ${{ inputs.bootstrap }}
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          if [[ "$BOOTSTRAP" == true ]]; then
            node scripts/refresh-team-players.js --bootstrap
          elif [[ "$DAILY" == true ]]; then
            node scripts/refresh-team-players.js --daily
          else
            node scripts/refresh-team-players.js --manual
          fi
      - name: Publish the player page summaries
        if: steps.refresh.outputs.refreshed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ ! -d published/team-players ]]; then exit 0; fi
          git add published/team-players
          if git diff --cached --quiet; then exit 0; fi
          node scripts/prepare-static.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh player page summaries'
          git pull --rebase origin main
          git push origin HEAD:main
          gh workflow run test.yml --ref main
      - uses: actions/cache/save@v4
        if: steps.refresh.outputs.refreshed == 'true'
        with:
          path: research/cache/player-inputs/season-cache.encrypted.json
          key: player-source-v1-${{ runner.os }}-${{ github.run_id }}
