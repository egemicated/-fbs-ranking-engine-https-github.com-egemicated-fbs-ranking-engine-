name: Dispatch queued support notifications
on: workflow_dispatch
permissions:
  contents: read
jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Dispatch existing private notification queue
        env:
          SUPPORT_DISPATCH_SECRET: ${{ secrets.SUPPORT_DISPATCH_SECRET }}
        run: |
          if [ -z "$SUPPORT_DISPATCH_SECRET" ]; then
            echo "::error::Configure the repository SUPPORT_DISPATCH_SECRET before dispatching notifications."
            exit 1
          fi
          node scripts/dispatch-support-notifications.mjs
