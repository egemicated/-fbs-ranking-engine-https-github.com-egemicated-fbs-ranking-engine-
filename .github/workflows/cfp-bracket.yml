name: CFP bracket contest
on:
  push:
    branches: [main]
    paths: ['data/cfp-bracket-2026.json']
  workflow_dispatch:
    inputs:
      mode:
        description: Publish the reviewed field or refresh final scores
        type: choice
        options: [selection, game-night]
        default: selection
permissions:
  contents: read
concurrency:
  group: cfp-bracket-contest
  cancel-in-progress: false
jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Publish the playoff field or confirmed final scores
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_MODE: ${{ inputs.mode }}
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          CFP_SUPABASE_SECRET_KEY: ${{ secrets.CFP_SUPABASE_SECRET_KEY }}
        run: |
          case "$EVENT_NAME" in
            push) mode=selection ;;
            workflow_dispatch) mode="$REQUESTED_MODE" ;;
            *) exit 1 ;;
          esac
          node scripts/sync-cfp-bracket.js "--$mode"
