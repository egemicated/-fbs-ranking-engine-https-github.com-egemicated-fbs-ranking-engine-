name: Weekly CFBD rankings
on:
  schedule:
    - cron: '1 0 * * 0'
      timezone: 'America/Denver'
    - cron: '11 4 * * 0'
      timezone: 'America/Denver'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['published/refresh-request.json']
permissions:
  contents: write
concurrency:
  group: weekly-cfbd-rankings
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RANKING_SEASON: '2026'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check whether the scheduled refresh is needed
        id: refresh-needed
        env:
          EVENT_NAME: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
        run: |
          if [[ "$EVENT_NAME" != schedule ]]; then
            needed=true
          elif [[ "$CRON" == '11 4 * * 0' ]]; then
            needed=$(node scripts/weekly-refresh-needed.js --catch-up)
          else
            needed=$(node scripts/weekly-refresh-needed.js)
          fi
          echo "needed=$needed" >> "$GITHUB_OUTPUT"
      - if: steps.refresh-needed.outputs.needed == 'true'
        run: npm test
      - name: Fetch CFBD and calculate rankings
        id: primary-publish
        if: steps.refresh-needed.outputs.needed == 'true'
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: node scripts/refresh-weekly.js
      - name: Save weekly picks and confirmed results
        id: weekly-picks
        if: steps.primary-publish.outcome == 'success'
        continue-on-error: true
        run: node scripts/publish-weekly-picks.js --season "data/seasons/${RANKING_SEASON}.json" --snapshot published/latest.json --output published/weekly-picks.json
      - name: Record frozen achievement comparison
        if: steps.primary-publish.outcome == 'success'
        continue-on-error: true
        run: node scripts/record-research-comparison.js
      - name: Update Beat the Model games and grade saved picks
        if: steps.weekly-picks.outcome == 'success'
        continue-on-error: true
        env:
          CFP_SUPABASE_SECRET_KEY: ${{ secrets.CFP_SUPABASE_SECRET_KEY }}
        run: node scripts/sync-weekly-contest.js
      - name: Record frozen division candidate and next-week forecasts
        if: steps.primary-publish.outcome == 'success'
        continue-on-error: true
        run: node scripts/record-division-comparison.js
      - name: Score previously saved division forecasts
        if: steps.primary-publish.outcome == 'success'
        continue-on-error: true
        run: node research/evaluate_division_forecasts.mjs
      - name: Set up the optional Performance calculator
        id: performance-python
        if: steps.primary-publish.outcome == 'success'
        continue-on-error: true
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the Performance calculator dependency
        id: performance-deps
        if: steps.performance-python.outcome == 'success'
        continue-on-error: true
        run: python -m pip install -r research/performance-requirements.txt
      - name: Publish experimental Performance from one extra CFBD request
        id: performance-publish
        if: steps.performance-deps.outcome == 'success'
        continue-on-error: true
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python scripts/publish-performance.py --snapshot published/latest.json --season data/seasons/2026.json --output published/performance-latest.json
      - name: Retain the successful derived Performance snapshot
        if: steps.performance-publish.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: experimental-performance-${{ github.run_id }}
          path: published/performance-latest.json
          retention-days: 14
          if-no-files-found: warn
      - name: Save frozen blend predictions before upcoming kickoffs
        if: steps.performance-publish.outcome == 'success'
        continue-on-error: true
        run: node scripts/record-blend-comparison.js
      - name: Score previously saved blend predictions
        if: always() && steps.primary-publish.outcome == 'success'
        continue-on-error: true
        run: node research/evaluate_blend_forecasts.mjs
      - name: Retain derived results and source checksums
        if: always() && steps.refresh-needed.outputs.needed == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: cfbd-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          # The public repository must not distribute raw CFBD responses or
          # normalized source datasets. They remain in the private job workspace.
          path: |
            evidence/weekly/manifest.json
            evidence/weekly/snapshot.json
            evidence/weekly/research-comparison.json
            evidence/weekly/division-comparison.json
            research/blend-observations/*.json
            research/blend-evaluations/latest.json
          retention-days: 14
          if-no-files-found: warn
      - name: Save the weekly snapshot
        if: always() && steps.primary-publish.outcome == 'success'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add published/latest.json
          git add published/performance-latest.json
          if test -f published/weekly-picks.json; then git add published/weekly-picks.json; fi
          if test -f frontend/ranking-history.json; then git add frontend/ranking-history.json frontend/ranking-editions.json; fi
          git add research/observations/
          git add research/division-observations/
          git add research/blend-observations/
          git add research/blend-evaluations/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish weekly CFBD rankings'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Grade playoff brackets from the saved finals
        if: steps.weekly-picks.outcome == 'success'
        continue-on-error: true
        env:
          CFP_SUPABASE_SECRET_KEY: ${{ secrets.CFP_SUPABASE_SECRET_KEY }}
        run: node scripts/sync-cfp-bracket.js
