name: Weekly CFBD rankings
run-name: ${{ inputs.scheduled_fallback && 'Forge overnight fallback' || github.workflow }}
on:
  workflow_dispatch:
    inputs:
      scheduled_fallback:
        description: Apply the scheduled freshness and duplicate checks
        type: boolean
        default: false
      contest_sync_only:
        description: Grade Beat the Model from the saved finals without pulling CFBD
        type: boolean
        default: false
      kickoff_sync_only:
        description: Reconcile TBD kickoff flags from the saved slate without requesting provider data
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ['published/refresh-request.json']
permissions:
  contents: write
  actions: write
concurrency:
  group: weekly-cfbd-rankings
  cancel-in-progress: false
jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RANKING_SEASON: '2026'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Skip a duplicate overnight update
        id: schedule
        if: inputs.scheduled_fallback
        env:
          GH_TOKEN: ${{ github.token }}
          SCHEDULED_FALLBACK: ${{ inputs.scheduled_fallback }}
        run: node scripts/scheduled-update-needed.mjs results
      - name: Check whether the scheduled refresh is needed
        id: refresh-needed
        if: ${{ !inputs.scheduled_fallback || steps.schedule.outputs.needed == 'true' }}
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULED_FALLBACK: ${{ inputs.scheduled_fallback }}
          PUSH_REVISION: ${{ github.sha }}
          CONTEST_SYNC_ONLY: ${{ inputs.contest_sync_only }}
          KICKOFF_SYNC_ONLY: ${{ inputs.kickoff_sync_only }}
        run: |
          if [[ "$EVENT_NAME" == push ]]; then
            git cat-file -e "$PUSH_REVISION^{commit}" 2>/dev/null || git fetch --no-tags --depth=1 origin "$PUSH_REVISION"
            request_mode=$(git show "$PUSH_REVISION:published/refresh-request.json" | node --input-type=module -e '
              import { readFileSync } from "node:fs";
              const { mode = "results" } = JSON.parse(readFileSync(0, "utf8"));
              if (!["results", "kickoff-only"].includes(mode)) throw new Error("Unrecognized refresh request mode");
              console.log(mode);
            ')
            if [[ "$request_mode" == kickoff-only ]]; then KICKOFF_SYNC_ONLY=true; fi
          fi
          if [[ "$CONTEST_SYNC_ONLY" == true || "$KICKOFF_SYNC_ONLY" == true ]]; then
            needed=false
          elif [[ "$SCHEDULED_FALLBACK" != true ]]; then
            needed=true
          else
            needed=$(node scripts/weekly-refresh-needed.js)
          fi
          echo "needed=$needed" >> "$GITHUB_OUTPUT"
          echo "kickoff_only=$KICKOFF_SYNC_ONLY" >> "$GITHUB_OUTPUT"
      - name: Check the engine before requesting CFBD data
        if: steps.refresh-needed.outputs.needed == 'true'
        run: |
          npm ci --omit=dev
          npm test
      - name: Fetch CFBD and calculate rankings
        id: primary-publish
        if: steps.refresh-needed.outputs.needed == 'true'
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: node scripts/refresh-weekly.js
      - name: Save weekly picks and confirmed results
        id: weekly-picks
        if: steps.primary-publish.outcome == 'success'
        run: node scripts/publish-weekly-picks.js --season "data/seasons/${RANKING_SEASON}.json" --snapshot published/latest.json --output published/weekly-picks.json
      - name: Save paired cross-division research forecasts
        if: steps.weekly-picks.outcome == 'success'
        continue-on-error: true
        run: node research/capture-cross-division-shadow.mjs
      - name: Grade saved cross-division research forecasts
        if: steps.weekly-picks.outcome == 'success'
        continue-on-error: true
        run: node research/evaluate-cross-division-shadow.mjs
      - name: Record paired pregame forecasts for the recent-form trial
        if: steps.weekly-picks.outcome == 'success'
        continue-on-error: true
        run: node research/capture-recent-form-shadow.mjs
      - name: Grade the recent-form trial against verified finals
        if: steps.weekly-picks.outcome == 'success'
        continue-on-error: true
        run: node research/evaluate-recent-form-shadow.mjs
      - name: Save FCS weekly picks from the same refresh
        id: fcs-weekly-picks
        if: steps.primary-publish.outcome == 'success'
        run: node scripts/publish-weekly-picks.js --cohort fcs --season "data/seasons/${RANKING_SEASON}.json" --snapshot published/latest.json --output published/weekly-fcs-picks.json
      - name: Check saved kickoff flags without requesting provider data
        id: kickoff-check
        if: steps.refresh-needed.outputs.needed == 'false' && (inputs.scheduled_fallback || steps.refresh-needed.outputs.kickoff_only == 'true')
        continue-on-error: true
        run: node scripts/refresh-published-kickoffs.js
      - name: Record frozen achievement comparison
        if: steps.primary-publish.outcome == 'success'
        continue-on-error: true
        run: node scripts/record-research-comparison.js
      - name: Record frozen division candidate and next-week forecasts
        if: steps.primary-publish.outcome == 'success'
        continue-on-error: true
        run: node scripts/record-division-comparison.js
      - name: Score previously saved division forecasts
        if: steps.primary-publish.outcome == 'success'
        continue-on-error: true
        run: node research/evaluate_division_forecasts.mjs
      - name: Set up the optional Performance calculator
        id: performance-python
        if: steps.primary-publish.outcome == 'success'
        continue-on-error: true
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the Performance calculator dependency
        id: performance-deps
        if: steps.performance-python.outcome == 'success'
        continue-on-error: true
        run: python -m pip install -r research/performance-requirements.txt
      - name: Publish experimental Performance from one extra CFBD request
        id: performance-publish
        if: steps.performance-deps.outcome == 'success'
        continue-on-error: true
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python scripts/publish-fcs-performance.py --snapshot published/latest.json --season data/seasons/2026.json --output published/performance-latest.json
      - name: Retain the successful derived Performance snapshot
        if: steps.performance-publish.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: experimental-performance-${{ github.run_id }}
          path: published/performance-latest.json
          retention-days: 14
          if-no-files-found: warn
      - name: Save frozen blend predictions before upcoming kickoffs
        if: steps.performance-publish.outcome == 'success'
        continue-on-error: true
        run: node scripts/record-blend-comparison.js
      - name: Score previously saved blend predictions
        if: always() && steps.primary-publish.outcome == 'success'
        continue-on-error: true
        run: node research/evaluate_blend_forecasts.mjs
      - name: Retain derived results and source checksums
        if: always() && steps.refresh-needed.outputs.needed == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: cfbd-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          # The public repository must not distribute raw CFBD responses or
          # normalized source datasets. They remain in the private job workspace.
          path: |
            evidence/weekly/manifest.json
            evidence/weekly/snapshot.json
            evidence/weekly/research-comparison.json
            evidence/weekly/division-comparison.json
            research/blend-observations/*.json
            research/blend-evaluations/latest.json
            research/recent-form-observations/*.json
            research/recent-form-evaluations/latest.json
          retention-days: 14
          if-no-files-found: warn
      - name: Save the weekly snapshot
        id: saved-snapshot
        if: >-
          ${{ !cancelled() && ((steps.primary-publish.outcome == 'success' &&
          steps.weekly-picks.outcome == 'success' && steps.fcs-weekly-picks.outcome == 'success') ||
          steps.kickoff-check.outputs.updated == 'true') }}
        env:
          GH_TOKEN: ${{ github.token }}
          PRIMARY_REFRESH_NEEDED: ${{ steps.refresh-needed.outputs.needed }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add published/latest.json
          git add published/performance-latest.json
          if test -f published/weekly-picks.json; then git add published/weekly-picks.json; fi
          if test -f published/weekly-fcs-picks.json; then git add published/weekly-fcs-picks.json; fi
          if test -f frontend/ranking-history.json; then git add frontend/ranking-history.json frontend/ranking-editions.json; fi
          git add research/observations/
          git add research/division-observations/
          git add research/blend-observations/
          git add research/blend-evaluations/
          git add research/recent-form-observations/
          if test -f research/recent-form-evaluations/latest.json; then git add research/recent-form-evaluations/latest.json; fi
          git add research/cross-division-calibration-observations/
          if test -f research/cross-division-calibration-evaluations/latest.json; then git add research/cross-division-calibration-evaluations/latest.json; fi
          if git diff --cached --quiet; then exit 0; fi
          # Check the candidate publications. Kickoff-only changes did not run the earlier Node suite.
          if [[ "$PRIMARY_REFRESH_NEEDED" == true ]]; then
            node scripts/prepare-static.js --build-only
          else
            node scripts/prepare-static.js
          fi
          git commit -m 'Publish weekly CFBD rankings'
          git pull --rebase origin main
          git push origin HEAD:main
          # Bot-token pushes do not trigger push workflows. Dispatch the same
          # exact-main quality gate explicitly so Render can verify it.
          gh workflow run test.yml --ref main
      - name: Grade playoff brackets from the saved finals
        if: steps.weekly-picks.outcome == 'success'
        continue-on-error: true
        env:
          CFP_SUPABASE_SECRET_KEY: ${{ secrets.CFP_SUPABASE_SECRET_KEY }}
        run: node scripts/sync-cfp-bracket.js
      - name: Retry configured support-request notifications
        if: ${{ !cancelled() && (!inputs.scheduled_fallback || steps.schedule.outputs.needed == 'true') }}
        continue-on-error: true
        env:
          SUPPORT_DISPATCH_SECRET: ${{ secrets.SUPPORT_DISPATCH_SECRET }}
        run: node scripts/dispatch-support-notifications.mjs
      - name: Update Beat the Model games and grade saved picks
        # Re-try the committed slate even on a later no-change check. The RPC treats an already synced observation as stale.
        if: >-
          ${{ !cancelled() && (inputs.contest_sync_only || steps.kickoff-check.outputs.updated == 'false' ||
          (steps.saved-snapshot.outcome == 'success' &&
          (steps.weekly-picks.outcome == 'success' || steps.kickoff-check.outputs.updated == 'true'))) }}
        env:
          CFP_SUPABASE_SECRET_KEY: ${{ secrets.CFP_SUPABASE_SECRET_KEY }}
        run: node scripts/sync-weekly-contest.js
