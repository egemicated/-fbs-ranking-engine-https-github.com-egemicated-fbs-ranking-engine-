name: One-time FCS Performance publication
on:
  push:
    branches: ['codex/fcs-performance-seed-20261115']
    paths: ['research/fcs-performance-seed-20261115-request.json']
permissions:
  contents: write
concurrency:
  group: fcs-performance-seed-20261115
  cancel-in-progress: false
jobs:
  seed:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r research/performance-requirements.txt
      - run: python -m unittest discover -s scripts -p 'test_publish_performance.py'
      - name: Verify the saved snapshot and request
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          snapshot = Path('published/latest.json').read_bytes()
          request = json.loads(Path('research/fcs-performance-seed-20261115-request.json').read_bytes())
          assert request == {'snapshotSha256': 'f7660d4aa4ebe82dfc1a1749bcc5e2f549f9fefaad9367686bd42122c73fca99', 'snapshotHash': 'b6b8bac6fa07783cb96922e74f272f03c106b584fd2c1a2b6e638a07ffa6551e', 'asOf': '2026-11-15T14:39:14.774Z', 'maximumCfbdCalls': 1}
          assert hashlib.sha256(snapshot).hexdigest() == request['snapshotSha256']
          print('Verified the saved snapshot for the single requested CFBD call.')
          PY
      - name: Fetch the season advanced statistics once and derive rankings
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python scripts/publish-performance.py --snapshot published/latest.json --output published/performance-latest.json
      - name: Verify and save the derived publication
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          import { performanceForSnapshot } from './src/performance-publication.js';

          const read = async path => JSON.parse(await readFile(path, 'utf8'));
          const [snapshot, candidate] = await Promise.all([read('published/latest.json'), read('published/performance-latest.json')]);
          assert.equal(candidate.source.requestCount, 1);
          const projection = performanceForSnapshot(candidate, snapshot);
          assert.ok(projection?.fcsRankings?.length, 'FCS scores must pass the serving validator');
          assert.equal(projection.fcsRankings.length, snapshot.ratings.filter(team => team.division === 'fcs').length);
          assert.equal(projection.rankings.length, snapshot.rankings.length);
          console.log(JSON.stringify({ season: candidate.season, asOf: candidate.asOf, baseSnapshotHash: candidate.baseSnapshotHash, publicationHash: candidate.publicationHash, coverage: candidate.coverage }));
          JS
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- published/performance-latest.json
          git commit -m 'Seed derived FCS Performance rankings'
          git push origin HEAD:refs/heads/codex/fcs-performance-seed-20261115
