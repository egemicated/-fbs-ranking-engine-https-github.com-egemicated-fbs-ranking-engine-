name: Performance research checks
on:
  push:
    paths:
      - 'research/performance*'
      - 'research/test_performance*'
      - '.github/workflows/performance.yml'
  pull_request:
    paths:
      - 'research/performance*'
      - 'research/test_performance*'
      - '.github/workflows/performance.yml'
permissions:
  contents: read
jobs:
  performance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/performance-requirements.txt
      - run: python -m unittest discover -s research -p 'test_performance*.py' -v
