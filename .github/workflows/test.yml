name: Engine checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: isolated-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Full Node test suite
        run: npm test
      - name: Isolated migrations, privacy, and account SQL tests
        run: node scripts/check-database.mjs
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: isolated-test-only
      - name: Pinned managed Auth integration tests
        env:
          AUTH_TEST_RUNTIME: ${{ runner.temp }}/forge-auth
          AUTH_TEST_BINARY: ${{ runner.temp }}/forge-auth/auth
          AUTH_TEST_REPORT: ${{ runner.temp }}/forge-auth/result.json
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: isolated-test-only
        run: |
          mkdir -p "$AUTH_TEST_RUNTIME"
          curl --fail --location --retry 3 \
            https://github.com/supabase/auth/releases/download/v2.198.0/auth-v2.198.0-amd64.tar.xz \
            --output "$AUTH_TEST_RUNTIME/auth.tar.xz"
          echo "4abe9134d7615faa9149cab514acada8e7133cd69d2ccd96fdcef0d795c05171  $AUTH_TEST_RUNTIME/auth.tar.xz" | sha256sum --check
          tar -xJf "$AUTH_TEST_RUNTIME/auth.tar.xz" -C "$AUTH_TEST_RUNTIME"
          node scripts/check-auth-api.mjs
      - name: Build the validated static site
        run: node scripts/prepare-static.js --build-only
      - run: npx playwright install --with-deps chromium
      - run: node scripts/browser-quality.mjs
      - name: Account and administration browser regressions
        run: node scripts/account-browser-quality.mjs
      - name: Followed-team carousel browser regressions
        run: node scripts/my-team-carousel-browser-quality.mjs
      - name: Published scoreboard freshness browser regressions
        run: node scripts/scoreboard-browser-quality.mjs
      - name: Navigation, metadata and searchable teams
        run: node scripts/site-polish-browser-quality.mjs
      - name: Browser security policy enforcement
        run: node scripts/check-security-policy-browser.mjs
      - name: Basketball publication and browser regressions
        if: hashFiles('published/basketball-site/manifest.json') != ''
        run: node scripts/browser-basketball-publication.mjs
