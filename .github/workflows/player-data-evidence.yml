name: Private player data evidence
on:
  push:
    branches: ['codex/player-data-audit']
    paths: ['research/player-data-request.json']
permissions:
  contents: read
concurrency:
  group: private-player-data-evidence
  cancel-in-progress: false
jobs:
  collect:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Collect the declared player data once
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: node research/player-data-cache.mjs collect
      - uses: actions/upload-artifact@v7
        with:
          name: encrypted-player-data-${{ github.run_id }}
          path: |
            research/cache/player-inputs/manifest.json
            research/cache/player-inputs/player-input.envelope.json
          retention-days: 2
          if-no-files-found: error
