name: CFP committee rankings
on:
  workflow_dispatch:
    inputs:
      release_date:
        description: 'Optional CFP release date (YYYY-MM-DD). Defaults to the latest due unsaved edition.'
        type: string
permissions:
  contents: write
  actions: write
jobs:
  publish:
    uses: ./.github/workflows/ap-archive.yml
    with:
      scope: cfp
      release_date: ${{ inputs.release_date }}
